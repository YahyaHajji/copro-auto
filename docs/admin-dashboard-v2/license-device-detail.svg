<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Copro Auto — détail d'une licence et de ses appareils</title>
  <desc id="desc">Panneau latéral détaillant les états, versions et heures de connexion des appareils.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-10%" width="170%" height="130%"><feDropShadow dx="-12" dy="0" stdDeviation="22" flood-color="#173134" flood-opacity=".18"/></filter>
    <style>
      .ui{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#173134}.muted{fill:#678084}.white{fill:#fff}.side{fill:#b9cecd}.eyebrow{fill:#168f86;font-size:12px;font-weight:800;letter-spacing:1.7px}.h1{font-size:30px;font-weight:760}.h2{font-size:18px;font-weight:750}.body{font-size:14px}.small{font-size:12px}.tiny{font-size:11px}.bold{font-weight:720}.num{font-variant-numeric:tabular-nums}.label{font-size:11px;font-weight:750;letter-spacing:.5px}.pill{font-size:11px;font-weight:760}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f3f7f6"/>
  <rect width="236" height="1000" fill="#102c2f"/><rect x="22" y="24" width="44" height="44" rx="13" fill="#168f86"/><text x="44" y="52" text-anchor="middle" class="ui white bold body">CA</text><text x="80" y="41" class="ui white bold body">COPRO AUTO</text><text x="80" y="59" class="ui small" fill="#a7c1c0">Administration</text>
  <rect x="14" y="104" width="208" height="48" rx="12" fill="#244649"/><text x="70" y="134" class="ui white bold body">▦  Licences</text><text x="70" y="191" class="ui side bold body">↻  Activité</text>
  <g opacity=".42" transform="translate(276,42)">
