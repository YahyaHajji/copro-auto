        <text x="48" y="89" class="ui small">Copro Auto 0.3.0</text><rect x="175" y="72" width="119" height="24" rx="12" fill="#fff3d6"/><text x="235" y="89" text-anchor="middle" class="ui pill" fill="#765d1e">Mise à jour 0.4.0</text>
        <line x1="24" y1="112" x2="718" y2="112" stroke="#e8efee"/>
        <text x="24" y="139" class="ui muted label">PREMIÈRE ACTIVATION</text><text x="24" y="162" class="ui body num">12 août 2026 à 10:05</text>
        <text x="268" y="139" class="ui muted label">DERNIER CONTACT</text><text x="268" y="162" class="ui body num">29 août 2026 à 14:31</text><text x="268" y="181" class="ui" fill="#246b8e" font-size="11" font-weight="700">il y a 4 minutes</text>
        <text x="530" y="139" class="ui muted label">IDENTIFIANT SUPPORT</text><text x="530" y="162" class="ui body num">A19C04F2</text>
