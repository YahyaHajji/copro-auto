    <rect x="592" y="52" width="112" height="30" rx="15" fill="#fff3d6"/><text x="648" y="72" text-anchor="middle" class="ui pill" fill="#765d1e">À renouveler</text>
    <rect x="734" y="30" width="44" height="44" rx="12" fill="#eef4f3"/><text x="756" y="60" text-anchor="middle" class="ui muted" font-size="25">×</text>

