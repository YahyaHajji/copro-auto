[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "copro-auto-license-server"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.139.2",
  "uvicorn==0.51.0",
  "sqlalchemy==2.0.51",
  "psycopg[binary]==3.3.4",
  "cryptography==49.0.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[project.scripts]
copro-license-admin = "license_server.admin_cli:main"
copro-admin-password = "license_server.admin_auth:main"

[tool.vercel]
entrypoint = "app:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
license_server = ["static/*.html", "static/*.css", "static/*.js"]
