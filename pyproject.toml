[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "copro-auto"
version = "0.1.0"
description = "Automatisation locale des dossiers de copropriete topographique"
requires-python = ">=3.13,<3.14"
dependencies = [
  "PySide6==6.11.1",
  "python-docx==1.2.0",
  "ezdxf==1.4.4",
  "cryptography==49.0.0",
  "platformdirs==4.3.8",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "PyInstaller==6.21.0"]

[project.scripts]
copro-auto = "copro_auto.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests", "license_server/src"]
testpaths = ["tests", "license_server/tests"]
markers = [
  "postgres: integration tests that require TEST_POSTGRES_URL and a disposable real PostgreSQL database",
]
